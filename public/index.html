<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutual Transfer</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><a class="brand" href="/">↗ Mutual Transfer</a><span class="pill">局域网文件空间</span></header>
<section class="intro"><span class="eyebrow">让文件到达另一台设备</span><h1>选择文件。<br>在另一端打开。</h1><p>电脑、手机和平板，共用一个文件空间。文件保留在运行服务的电脑上。</p></section>
<section id="join" class="panel"><h2>加入文件空间</h2><p>输入服务端提供的访问密钥。拥有密钥的成员可以上传、下载和删除空间内的文件。</p><form id="login"><label for="key">访问密钥</label><div class="row"><input id="key" type="password" autocomplete="off" required minlength="24"><button>加入</button></div></form></section>
<section id="workspace" hidden><div class="toolbar"><h2>文件空间</h2><div class="row"><button id="refresh" class="secondary">刷新</button><button id="logout" class="secondary">退出</button></div></div>
<div class="panel upload"><label for="files">选择要传输的文件</label><input type="file" id="files" multiple><p>支持任意文件格式。意外中断后，重新选择原文件即可续传。请保持当前页面打开。</p><progress id="progress" max="100" value="0" hidden></progress><p id="progress-label" aria-live="polite"></p><button id="pause" class="secondary" hidden>暂停</button></div>
<div id="list" class="file-list"></div></section>
<p id="status" role="status" aria-live="polite"></p><footer>直接存储 · 分块传输 · 完成后提供 SHA-256 校验值</footer>
<dialog id="preview"><div class="toolbar"><h2 id="preview-title">预览</h2><button id="close" class="secondary">关闭</button></div><div id="preview-body"></div></dialog>
</main><script type="module" src="/app.js"></script></body></html>
