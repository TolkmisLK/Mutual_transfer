plugins { id 'com.android.application' }
android {
    namespace 'dev.ncc.mutualtransfer'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.ncc.mutualtransfer'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // This type is test-only: its generated ephemeral CA must never enter a
    // distributable debug/release APK. Separate ID prevents profile reuse.
    buildTypes {
        acceptance {
            initWith debug
            applicationIdSuffix '.acceptance'
            matchingFallbacks = ['debug']
        }
    }
    testBuildType project.hasProperty('acceptanceTests') ? 'acceptance' : 'debug'
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
